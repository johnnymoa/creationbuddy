<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creation Buddy — Be Back Later</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: #05010f;
    display: flex; align-items: center; justify-content: center;
    perspective: 900px;
  }
  canvas#fx { position: fixed; inset: 0; z-index: 1; pointer-events: none; }

  /* animated deep-space gradient */
  .bg {
    position: fixed; inset: -20%;
    background:
      radial-gradient(circle at 20% 30%, rgba(255,0,128,.35), transparent 40%),
      radial-gradient(circle at 80% 20%, rgba(0,200,255,.35), transparent 40%),
      radial-gradient(circle at 60% 80%, rgba(150,0,255,.35), transparent 45%),
      radial-gradient(circle at 30% 70%, rgba(255,200,0,.25), transparent 40%),
      #05010f;
    animation: hue 14s linear infinite, drift 20s ease-in-out infinite alternate;
    z-index: 0;
  }
  @keyframes hue { to { filter: hue-rotate(360deg); } }
  @keyframes drift { from { transform: translate(-2%, -1%) scale(1); } to { transform: translate(2%, 2%) scale(1.06); } }

  /* floating shapes with depth */
  .shape {
    position: fixed; z-index: 2; opacity: .85;
    mix-blend-mode: screen;
    animation: float 9s ease-in-out infinite alternate, spin 16s linear infinite;
    will-change: transform;
  }
  .shape.b1 { left: 8%;  top: 12%; width: 120px; height: 120px; border-radius: 24px;
    background: linear-gradient(135deg, #ff3cac, #784bff); animation-delay: -2s; }
  .shape.b2 { right: 10%; top: 18%; width: 90px; height: 90px; border-radius: 50%;
    background: linear-gradient(135deg, #00ffd5, #0084ff); animation-delay: -5s; }
  .shape.b3 { left: 15%; bottom: 15%; width: 70px; height: 70px;
    background: linear-gradient(135deg, #ffe600, #ff6a00);
    clip-path: polygon(50% 0, 100% 100%, 0 100%
); animation-delay: -1s; }
  .shape.b4 { right: 14%; bottom: 20%; width: 100px; height: 100px;
    background: linear-gradient(135deg, #b300ff, #ff0080);
    clip-path: polygon(50% 0,100% 38%,82% 100%,18% 100%,0 38%); animation-delay: -7s; }
  .shape.b5 { left: 45%; top: 6%; width: 60px; height: 60px; border-radius: 12px;
    background: linear-gradient(135deg, #00ff88, #00ccff); animation-delay: -4s; }
  .shape.b6 { right: 38%; bottom: 8%; width: 55px; height: 55px; border-radius: 50%;
    background: linear-gradient(135deg, #ff0055, #ffb700); animation-delay: -3s; }
  @keyframes float { from { transform: translateY(-30px) rotate(0deg) translateZ(60px); } to { transform: translateY(30px) rotate(20deg) translateZ(-40px); } }
  @keyframes spin  { to { transform: rotate(360deg); } }

  .center { position: relative; z-index: 3; text-align: center; transform-style: preserve-3d; }

  .title {
    font-size: clamp(3rem, 11vw, 9rem);
    font-weight: 900; letter-spacing: .04em; line-height: 1;
    background: linear-gradient(90deg, #ff3cac, #ffe600, #00ffd5, #784bff, #ff3cac);
    background-size: 300% 100%;
    -webkit-background-clip: text; background-clip: text; color: transparent;
    animation: slide 4s linear infinite, pop 1s cubic-bezier(.2,1.6,.4,1) both;
    filter: drop-shadow(0 0 25px rgba(255,60,172,.55));
  }
  @keyframes slide { to { background-position: 300% 0; } }
  @keyframes pop { 0% { transform: scale(0) rotate(-8deg); opacity: 0; } 100% { transform: scale(1) rotate(0); opacity: 1; } }

  .sub {
    margin-top: 1.2rem; font-size: clamp(1.1rem, 3vw, 2rem);
    color: #eaf6ff; letter-spacing: .35em; text-transform: uppercase;
    opacity: 0; animation: rise .8s ease-out .5s forwards;
    text-shadow: 0 0 18px rgba(0,200,255,.8);
  }
  @keyframes rise { from { transform: translateY(25px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  .pulse-dot { display: inline-block; width: .6em; height: .6em; border-radius: 50%;
    background: #00ffd5;
 margin-right: .5em; vertical-align: middle;
    box-shadow: 0 0 12px #00ffd5; animation: blink 1.2s ease-in-out infinite; }
  @keyframes blink { 50% { opacity: .25; transform: scale(.7); } }

  .hint { position: fixed; bottom: 24px; width: 100%; text-align: center; z-index: 3;
    color: rgba(255,255,255,.45); font-size: .85rem; letter-spacing: .2em; }
</style>
</head>
<body>
  <div class="bg"></div>
  <div class="shape b1"></div><div class="shape b2"></div><div class="shape b3"></div>
  <div class="shape b4"></div><div class="shape b5"></div><div class="shape b6"></div>
  <canvas id="fx"></canvas>
  <div class="center">
    <h1 class="title">CREATION BUDDY</h1>
    <p class="sub"><span class="pulse-dot"></span>Will be back later</p>
  </div>
  <div class="hint">CLICK ANYWHERE FOR FIREWORKS &nbsp;·&nbsp; <a href="app.html" style="color:inherit">Open the app &rarr;</a></div>
<script>
(function () {
  const canvas = document.getElementById('fx');
  const ctx = canvas.getContext('2d');
  let W, H;
  function resize() { W = canvas.width = innerWidth; H = canvas.height = innerHeight; }
  resize(); addEventListener('resize', resize);

  const COLORS = ['#ff3cac','#ffe600','#00ffd5','#784bff','#ff6a00','#00ff88','#b300ff','#ff0055'];
  const parts = [];
  const SHAPES = ['circle','square','triangle','star'];

  function star(x, y, r, rot) {
    ctx.beginPath();
    for (let i = 0; i < 10; i++) {
      const a = rot + i * Math.PI / 5;
      const rr = i % 2 ? r * .45 : r;
      ctx[i ? 'lineTo' : 'moveTo'](x + Math.cos(a) * rr, y + Math.sin(a) * rr);
    }
    ctx.closePath();
  }

  function boom(x, y, n) {
    n = n || 120;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const sp = 2 + Math.random() * 9;
      parts.push({
        x, y,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 1, decay: .006 + Math.random() * .012,
        size: 3 + Math.random() * 7,
        color: COLORS[Math.random() * COLORS.length | 0],
 
       shape: SHAPES[Math.random() * SHAPES.length | 0],
        rot: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
        z: .3 + Math.random() * .7
      });
    }
  }

  function tick() {
    ctx.clearRect(0, 0, W, H);
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i];
      p.x += p.vx * p.z; p.y += p.vy * p.z;
      p.vy += .12 * p.z; p.vx *= .985; p.vy *= .985;
      p.rot += p.vr; p.life -= p.decay;
      if (p.life <= 0) { parts.splice(i, 1); continue; }
      ctx.globalAlpha = Math.max(p.life, 0);
      ctx.fillStyle = p.color;
      ctx.shadowColor = p.color; ctx.shadowBlur = 15;
      const s = p.size * p.z;
      if (p.shape === 'circle') {
        ctx.beginPath(); ctx.arc(p.x, p.y, s, 0, Math.PI * 2); ctx.fill();
      } else if (p.shape === 'square') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.fillRect(-s, -s, s * 2, s * 2); ctx.restore();
      } else if (p.shape === 'triangle') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
        ctx.beginPath(); ctx.moveTo(0, -s); ctx.lineTo(s, s); ctx.lineTo(-s, s);
        ctx.closePath(); ctx.fill(); ctx.restore();
      } else {
        star(p.x, p.y, s * 1.4, p.rot); ctx.fill();
      }
    }
    ctx.globalAlpha = 1; ctx.shadowBlur = 0;
    requestAnimationFrame(tick);
  }
  tick();
  // opening explosion
  setTimeout(() => boom(W / 2, H / 2, 200), 350);
  setTimeout(() => boom(W * .25, H * .35, 90), 700);
  setTimeout(() => boom(W * .75, H * .35, 90), 950);

  addEventListener('pointerdown', e => boom(e.clientX, e.clientY, 140));
  // ambient periodic bursts
  setInterval(() => boom(Math.random() * W, Math.random() * H * .7, 60), 2600);
})();
</script>
</body>
</html>
